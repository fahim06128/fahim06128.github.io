    Experience:
      - company: Bangladesh University of Engineering and Technology (BUET)
        position: Undergraduate Thesis Researcher
        location: Dhaka, Bangladesh
        start_date: 2025-06
        end_date: 2026-07
        summary: "Undergraduate thesis on morphology-aware single-lead ECG denoising and arrhythmia classification."
        highlights:
          - "Architected MorphoUFormer, combining multiscale convolutional patch encoding, gated U-shaped skip connections, a Transformer bottleneck, and a residual refinement network for single-lead ECG reconstruction."
          - "Formulated a Multi-Component Loss Function integrating time-domain Huber loss, normalized spectral magnitude loss, and temporal gradient/curvature loss to actively prevent over-smoothing of clinically vital segments (P-wave, QRS complex, ST-segment)."
          - "R-Peak Validation (Icentia 11K dataset): Recovered 193,524 missed beats, boosting Pan-Tompkins R-peak detection recall from 69.98% to 87.77%."
          - "Arrhythmia Classification (Georgia ECG dataset): Achieved 94.1% single-lead classification accuracy, driving a +31.47% F1 jump for the minority Atrial Fibrillation class."

      - company: Udvash Academic and Admission Care
        position: Academic Instructor (Chemistry)
        location: Dhaka, Bangladesh
        summary: "Instructing college and pre-university students in foundational and competitive chemistry principles."

    Publications:
      - title: "Vision-Guided Real-Time Obstacle Avoidance and Path Planning Using a Single Overhead Camera"
        authors:
          - Arif Zakaria
          - Md. Woahidur Rahman
          - Md. Fahim
          - Syed Mohammad Wasif Itban
        publisher: "2026 5th International Conference on Electrical, Computer & Telecommunication Engineering (ICECTE)"
        releaseDate: 2026
        url: "https://doi.org/10.1109/ICECTE69292.2026.11429463"
        summary: "Proposed real-time vision-based collision avoidance and trajectory generation using overhead camera feeds and deep learning."

    Projects:
      - name: "Automated Object Transportation System"
        summary: "Autonomous robotic pick-and-drop system utilizing ESP32, overhead ArUco marker tracking, YOLOv11-seg dynamic obstacle segmentation, and A* trajectory planning."
        highlights:
          - "Python, OpenCV, ESP32, YOLOv11-seg, A* Algorithm"

      - name: "HIVE-R: Swarm Drone System for GPS-Denied Rescue"
        summary: "Autonomous swarm drone platform integrating Raspberry Pi 4 and Pixhawk flight controller with Visual Odometry, SLAM, and edge YOLOv8 Nano object detection for low-visibility search and rescue."
        highlights:
          - "Python, Raspberry Pi, TensorFlow, Pixhawk, Visual SLAM"

      - name: "Smart Prepaid Energy Meter with Recharging System"
        summary: "Digital energy meter measuring real-time power consumption with IoT-enabled wireless prepaid billing and automatic relay disconnect upon balance exhaustion."
        highlights:
          - "Arduino, IoT, Current & Voltage Sensors"

      - name: "Camera-to-Camera Style Transfer"
        summary: "StarGAN v2 generative adversarial network model trained on 55,000+ patches from the IEEE SP Cup 2018 dataset for domain-specific cross-sensor style transfer."
        highlights:
          - "PyTorch, torchvision, t-SNE Analysis"

      - name: "Two-Player Pong Game on CPLD"
        summary: "Hardware-synthesized playable Pong game in Verilog HDL featuring custom FSMs, clock dividers, and real-time LED matrix/7-segment display rendering."
        highlights:
          - "Verilog HDL, Quartus 7.1, CPLD Hardware"

