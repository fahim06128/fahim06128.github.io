- id: "thesis"
  type_label: "UNDERGRADUATE THESIS (ONGOING FOR PUBLICATION)"
  title: "Morphology-Aware ECG Denoising Using Deep Neural Networks for Arrhythmia Detection"
  institution: "Bangladesh University of Engineering and Technology (BUET)"
  period: "2025–2026"
  supervisor: "Dr. Md. Kamrul Hasan, Professor, Department of EEE, BUET"
  summary: "Ambulatory ECG recordings are frequently corrupted by baseline wander, muscle artifacts, and electrode motion that distort critical P-Q-R-S-T wave morphology. This research develops MorphoUFormer, a multiscale deep architecture with gated skip connections, a Transformer bottleneck, and a multi-component morphology-preserving loss to clean signals while preserving vital diagnostic waveforms for downstream arrhythmia classification."
  images:
    - src: "/assets/img/research/morphology/Capture.png"
      alt: "ECG waveform morphology showing P, Q, R, S, T waves and PR/QT intervals"
      caption: "ECG Waveform Morphology & Characteristic Intervals"
    - src: "/assets/img/research/morphology/2.png"
      alt: "Three types of ECG noise: baseline wander, muscle artifact, and electrode motion"
      caption: "Three Types of Ambulatory Noise: BW, MA, and EM"
    - src: "/assets/img/research/morphology/3.png"
      alt: "Qualitative waveform comparison: raw preprocessed vs. MorphoUFormer denoised ECG"
      caption: "Qualitative Waveform Evaluation: Raw vs. MorphoUFormer Denoised"
  brief_pdf: "/assets/pdf/research/thesis-research-brief.pdf"
  action_label: "View Research Brief"

- id: "nilm"
  type_label: "ONGOING RESEARCH"
  title: "Weakly Supervised Temporal Action Localization for Non-Intrusive Load Monitoring"
  institution: "Bangladesh University of Engineering and Technology (BUET)"
  period: "2025–Present"
  supervisor: "Dr. Md. Kamrul Hasan"
  summary: "Non-Intrusive Load Monitoring (NILM) aims to disaggregate individual appliance electricity consumption from aggregate household smart-meter readings. This research investigates Weakly Supervised Temporal Action Localization (WTAL) to accurately identify activation boundaries and duration from aggregate power series using only coarse household-level presence indicators, eliminating costly sub-metered annotations."
  images:
    - src: "/assets/img/research/nilm/Capture.png"
      alt: "Individual appliance power consumption versus aggregate household smart meter reading"
      caption: "Submetered Appliance Consumption vs. Aggregate Household Load"
    - src: "/assets/img/research/nilm/2.png"
      alt: "Weakly supervised per-timestamp appliance localization framework from aggregate electricity series"
      caption: "Weakly Supervised Action Localization from Coarse Appliance Labels"
  brief_pdf: "/assets/pdf/research/nilm-wtal-research-brief.pdf"
  action_label: "View Research Brief"

