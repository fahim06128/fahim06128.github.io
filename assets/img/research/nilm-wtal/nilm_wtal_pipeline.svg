<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="auto">
  <defs>
    <style>
      .bg-panel { fill: #071827; stroke: #29445C; stroke-width: 1.5; rx: 8; }
      .box { fill: #0B2135; stroke: #29445C; stroke-width: 1.5; rx: 6; }
      .box-highlight { fill: #0B2135; stroke: #4DB8D8; stroke-width: 2; rx: 6; }
      .box-accent { fill: #0d2840; stroke: #F2C879; stroke-width: 2; rx: 6; }
      .title-text { fill: #65C6E5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; }
      .main-header { fill: #EAF2F8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; }
      .sub-text { fill: #B8C7D9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .accent-text { fill: #F2C879; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .dim-text { fill: #8CA0B5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; }
      .arrow { stroke: #4DB8D8; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-dashed { stroke: #F2C879; stroke-width: 1.5; stroke-dasharray: 4,3; marker-end: url(#arrowhead-gold); fill: none; }
      .waveform-agg { stroke: #4DB8D8; stroke-width: 2; fill: none; }
      .waveform-cam { stroke: #F2C879; stroke-width: 2; fill: none; }
      .waveform-disagg { stroke: #65C6E5; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4DB8D8" />
    </marker>
    <marker id="arrowhead-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F2C879" />
    </marker>
    <linearGradient id="aggGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DB8D8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4DB8D8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C879" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2C879" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Main Background Container -->
  <rect x="5" y="5" width="990" height="470" class="bg-panel" />

  <!-- Diagram Title Bar -->
  <text x="30" y="38" class="main-header">Weakly Supervised Temporal Action Localization (WTAL) for Non-Intrusive Load Monitoring</text>
  <text x="30" y="58" class="dim-text">Disaggregating appliance activations from aggregate smart-meter series using household-level presence labels</text>

  <!-- STAGE 1: Aggregate Power Input -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="180" height="240" class="box" />
    <text x="15" y="25" class="title-text">1. Smart-Meter Input</text>
    <text x="15" y="44" class="dim-text">Aggregate Power: P_total(t)</text>

    <!-- Synthetic Aggregate Waveform -->
    <path d="M 15 170 L 35 170 L 45 130 L 60 130 L 70 95 L 85 95 L 95 140 L 115 140 L 125 105 L 140 105 L 150 170 L 165 170" class="waveform-agg" />
    <path d="M 15 170 L 35 170 L 45 130 L 60 130 L 70 95 L 85 95 L 95 140 L 115 140 L 125 105 L 140 105 L 150 170 L 165 170 Z" fill="url(#aggGrad)" />

    <text x="15" y="200" class="sub-text">Total Active Power (kW)</text>
    <text x="15" y="216" class="dim-text">1-Hz / 1-min sampling</text>
    <text x="15" y="228" class="dim-text">Overlapping appliances</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 215 205 L 245 205" class="arrow" />

  <!-- STAGE 2: Multi-Scale Temporal Feature Extractor -->
  <g transform="translate(250, 85)">
    <rect x="0" y="0" width="200" height="240" class="box" />
    <text x="15" y="25" class="title-text">2. Temporal Backbone</text>
    <text x="15" y="44" class="dim-text">Multi-Scale 1D Conv / ResNet</text>

    <rect x="15" y="65" width="170" height="35" rx="4" fill="#112F4C" stroke="#29445C" />
    <text x="25" y="87" class="sub-text">1D Dilated Convolutions</text>

    <rect x="15" y="110" width="170" height="35" rx="4" fill="#112F4C" stroke="#29445C" />
    <text x="25" y="132" class="sub-text">Residual Sequence Blocks</text>

    <rect x="15" y="155" width="170" height="35" rx="4" fill="#112F4C" stroke="#29445C" />
    <text x="25" y="177" class="sub-text">Temporal Feature Maps F(t)</text>

    <text x="15" y="215" class="dim-text">Captures rapid switching</text>
    <text x="15" y="228" class="dim-text">&amp; extended duty cycles</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 455 205 L 485 205" class="arrow" />

  <!-- STAGE 3: WTAL Localization & CAM Head -->
  <g transform="translate(490, 85)">
    <rect x="0" y="0" width="220" height="240" class="box-highlight" />
    <text x="15" y="25" class="title-text">3. WTAL / CAM Core</text>
    <text x="15" y="44" class="dim-text">Class Activation Mapping</text>

    <!-- Activation Curve for Appliance -->
    <path d="M 15 135 C 35 135, 45 135, 55 90 C 65 70, 85 70, 95 90 C 105 135, 120 135, 130 135 C 145 135, 155 75, 175 75 C 190 75, 195 135, 205 135" class="waveform-cam" />
    <path d="M 15 135 C 35 135, 45 135, 55 90 C 65 70, 85 70, 95 90 C 105 135, 120 135, 130 135 C 145 135, 155 75, 175 75 C 190 75, 195 135, 205 135 Z" fill="url(#camGrad)" />

    <text x="15" y="160" class="accent-text">Appliance Attention Score A_k(t)</text>

    <rect x="15" y="175" width="190" height="48" rx="4" fill="#112F4C" stroke="#4DB8D8" stroke-dasharray="3,2" />
    <text x="25" y="195" class="sub-text">Temporal Pooling &amp; Scoring</text>
    <text x="25" y="210" class="dim-text">Top-k pooling over time series</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 715 205 L 745 205" class="arrow" />

  <!-- STAGE 4: Appliance Intervals & Disaggregation -->
  <g transform="translate(750, 85)">
    <rect x="0" y="0" width="220" height="240" class="box" />
    <text x="15" y="25" class="title-text">4. Disaggregated Output</text>
    <text x="15" y="44" class="dim-text">Target Appliance Activations</text>

    <!-- Interval boxes -->
    <g transform="translate(15, 65)">
      <rect x="0" y="0" width="190" height="42" rx="4" fill="#071827" stroke="#29445C" />
      <text x="10" y="18" class="title-text" style="font-size:11px;">Dishwasher (DW)</text>
      <rect x="60" y="24" width="70" height="12" rx="2" fill="#4DB8D8" opacity="0.8" />
      <text x="135" y="34" class="dim-text">[t_on, t_off]</text>
    </g>

    <g transform="translate(15, 115)">
      <rect x="0" y="0" width="190" height="42" rx="4" fill="#071827" stroke="#29445C" />
      <text x="10" y="18" class="accent-text" style="font-size:11px;">Washing Machine (WM)</text>
      <rect x="30" y="24" width="90" height="12" rx="2" fill="#F2C879" opacity="0.8" />
      <text x="125" y="34" class="dim-text">[t_on, t_off]</text>
    </g>

    <g transform="translate(15, 165)">
      <rect x="0" y="0" width="190" height="42" rx="4" fill="#071827" stroke="#29445C" />
      <text x="10" y="18" class="sub-text" style="font-size:11px;">Heat Pump / EV</text>
      <rect x="90" y="24" width="60" height="12" rx="2" fill="#65C6E5" opacity="0.8" />
      <text x="155" y="34" class="dim-text">[t_on, t_off]</text>
    </g>

    <text x="15" y="228" class="dim-text">Intervals &amp; power profiles</text>
  </g>

  <!-- BOTTOM COMPARISON PANEL: Supervision Paradigm -->
  <g transform="translate(30, 345)">
    <rect x="0" y="0" width="940" height="105" class="box-accent" />

    <text x="20" y="28" class="accent-text" style="font-size:13px;">SUPERVISION PARADIGM COMPARISON</text>

    <!-- Weak Supervision Column -->
    <g transform="translate(20, 42)">
      <text x="0" y="15" class="title-text" style="font-size:12px;">Weakly Supervised NILM (Focus of Ongoing Investigation)</text>
      <text x="0" y="32" class="sub-text">&#x2022; Requires only household-level binary presence labels Y_k in {0, 1} (ownership/usage).</text>
      <text x="0" y="47" class="sub-text">&#x2022; No submetering hardware required; non-intrusive, privacy-preserving, scalable.</text>
    </g>

    <!-- Traditional Strong Supervision Column -->
    <g transform="translate(540, 42)">
      <text x="0" y="15" class="dim-text" style="font-size:12px; font-weight:700;">Traditional Strongly Supervised NILM</text>
      <text x="0" y="32" class="dim-text">&#x2022; Demands individual plug-level sensor logs for every second of consumption.</text>
      <text x="0" y="47" class="dim-text">&#x2022; Highly intrusive, prohibitively expensive, and impractical for broad deployment.</text>
    </g>
  </g>
</svg>
